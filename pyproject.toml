[project]
name = "ai-recruiter"
version = "1.0.0"
description = "Intelligent Candidate Discovery & Ranking System for the Redrob Hackathon"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
